name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [3.13]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:8.0.30
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              echo "MongoDB is ready"
              exit 0
            fi
            sleep 2
          done
          docker ps -a
          docker logs mongodb
          exit 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.dev.txt

      - name: Setup test config file
        run: |
          cp tests/config/app.test.cfg src/instance/app.cfg

      - name: Test with pytest
        run: |
          pytest -vv -W ignore::DeprecationWarning
